# Состав под наблюдением. Поле source определяет, из какой АТС ждать звонки:
# Человек может звонить то через Kcell, то через Sipuni — у него могут быть
# ОБА блока, и звонки из обеих АТС суммируются:
#   kcell.login — матчинг по логину
#   sipuni.ext  — матчинг по внутреннему номеру в тексте «Схема»
# Нет блока — в этой АТС человек ни с чем не совпадёт.
#
# project + project_rops внизу — чтобы в алерте показывался РОП проекта.

