# ---------- Sipuni ----------
# ВАЖНО: ext — внутренний номер в SIPUNI (не в Kcell!). Ищется как отдельное
# число в тексте «Схема» выгрузки. Неверный номер = звонки не привяжутся и
# человек будет вечно «неактивен».
