# Состав под наблюдением. Поле source определяет, из какой АТС ждать звонки:
#   kcell  — матчинг строгий, по логину (operator_key == login)
#   sipuni — матчинг по внутреннему номеру внутри текста «Схема» выгрузки,
#            поэтому обязателен блок sipuni.ext
#
# project + project_rops внизу — чтобы в алерте показывался РОП проекта.

